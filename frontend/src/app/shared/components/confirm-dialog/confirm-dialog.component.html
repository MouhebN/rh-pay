<div class="backdrop">
  <section class="dialog">
    <h3>{{ title }}</h3>
    <p>{{ message }}</p>
    <div class="actions">
      <button type="button" class="secondary" (click)="cancelled.emit()">Annuler</button>
      <button type="button" class="danger" (click)="confirmed.emit()">Confirmer</button>
    </div>
  </section>
</div>
