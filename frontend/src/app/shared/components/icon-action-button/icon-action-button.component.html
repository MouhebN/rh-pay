<button
  [type]="type"
  class="icon-action"
  [class]="variant + ' ' + size"
  [disabled]="disabled"
  [attr.aria-label]="label()"
  [attr.title]="tooltip"
  (click)="activate()"
>
  <svg viewBox="0 0 24 24" aria-hidden="true">
    @switch (icon) {
      @case ('eye') {
        <path d="M2.5 12s3.4-6 9.5-6 9.5 6 9.5 6-3.4 6-9.5 6-9.5-6-9.5-6Z" />
        <circle cx="12" cy="12" r="3" />
      }
      @case ('pencil') {
        <path d="M12 20h9" />
        <path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z" />
      }
      @case ('trash') {
        <path d="M3 6h18" />
        <path d="M8 6V4h8v2" />
        <path d="m19 6-1 14H6L5 6" />
        <path d="M10 11v5M14 11v5" />
      }
      @case ('download') {
        <path d="M12 3v12" />
        <path d="m7 10 5 5 5-5" />
        <path d="M5 21h14" />
      }
      @case ('upload') {
        <path d="M12 21V9" />
        <path d="m7 14 5-5 5 5" />
        <path d="M5 3h14" />
      }
      @case ('check') {
        <path d="m20 6-11 11-5-5" />
      }
      @case ('x') {
        <path d="M18 6 6 18M6 6l12 12" />
      }
      @case ('refresh') {
        <path d="M21 12a9 9 0 0 1-15.5 6.2" />
        <path d="M3 12A9 9 0 0 1 18.5 5.8" />
        <path d="M18 2v4h4M6 22v-4H2" />
      }
      @case ('unlock') {
        <path d="M7 11V8a5 5 0 0 1 9.5-2.2" />
        <rect x="5" y="11" width="14" height="10" rx="2" />
      }
      @case ('lock') {
        <rect x="5" y="11" width="14" height="10" rx="2" />
        <path d="M8 11V8a4 4 0 0 1 8 0v3" />
      }
      @case ('ban') {
        <circle cx="12" cy="12" r="9" />
        <path d="m5.7 5.7 12.6 12.6" />
      }
      @case ('filter') {
        <path d="M4 5h16l-6 7v5l-4 2v-7Z" />
      }
      @case ('search') {
        <circle cx="11" cy="11" r="7" />
        <path d="m20 20-3-3" />
      }
      @case ('plus') {
        <path d="M12 5v14M5 12h14" />
      }
      @case ('file') {
        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8Z" />
        <path d="M14 2v6h6M8 13h8M8 17h6" />
      }
      @case ('calculator') {
        <rect x="5" y="2" width="14" height="20" rx="2" />
        <path d="M8 6h8M8 10h2M12 10h2M16 10h.01M8 14h2M12 14h2M16 14h.01M8 18h2M12 18h2M16 18h.01" />
      }
      @case ('clock') {
        <circle cx="12" cy="12" r="9" />
        <path d="M12 7v5l3 2" />
      }
      @case ('calendar') {
        <rect x="3" y="5" width="18" height="16" rx="2" />
        <path d="M16 3v4M8 3v4M3 11h18" />
      }
      @case ('bell') {
        <path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9" />
        <path d="M10 21h4" />
      }
      @case ('settings') {
        <circle cx="12" cy="12" r="3" />
        <path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1-2 3.4-.2-.1a1.7 1.7 0 0 0-2 .4l-.2.2a1.7 1.7 0 0 0-.4 2H9a1.7 1.7 0 0 0-.4-2l-.2-.2a1.7 1.7 0 0 0-2-.4l-.2.1-2-3.4.1-.1a1.7 1.7 0 0 0 .3-1.9 1.7 1.7 0 0 0-1.5-1.1H3v-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.9l-.1-.1 2-3.4.2.1a1.7 1.7 0 0 0 2-.4l.2-.2a1.7 1.7 0 0 0 .4-2h6a1.7 1.7 0 0 0 .4 2l.2.2a1.7 1.7 0 0 0 2 .4l.2-.1 2 3.4-.1.1a1.7 1.7 0 0 0-.3 1.9 1.7 1.7 0 0 0 1.5 1.1h.1v4h-.1a1.7 1.7 0 0 0-1.5 1.1Z" />
      }
      @case ('users') {
        <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2" />
        <circle cx="9" cy="7" r="4" />
        <path d="M22 21v-2a4 4 0 0 0-3-3.9M16 3.1a4 4 0 0 1 0 7.8" />
      }
      @case ('building') {
        <path d="M4 21V5a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v16" />
        <path d="M16 8h2a2 2 0 0 1 2 2v11M3 21h18M8 7h4M8 11h4M8 15h4" />
      }
      @case ('briefcase') {
        <rect x="3" y="7" width="18" height="13" rx="2" />
        <path d="M8 7V5a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2M3 12h18" />
      }
      @case ('wallet') {
        <path d="M20 7V6a2 2 0 0 0-2-2H5a3 3 0 0 0 0 6h15v10H5a3 3 0 0 1-3-3V7" />
        <path d="M16 14h.01" />
      }
      @case ('home') {
        <path d="m3 11 9-8 9 8" />
        <path d="M5 10v11h14V10" />
      }
    }
  </svg>
</button>
